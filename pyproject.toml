[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustfusion"
version = "1.0.0"
description = "TrustFusion: explainable, uncertainty-calibrated efficient multimodal deep learning for malware detection and classification (reproducibility code)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Mani Arora"}, {name = "Anuj Kumar Gupta"}]
keywords = ["malware detection", "multimodal learning", "conformal prediction", "uncertainty", "explainability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "lightgbm>=4.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
figures = ["matplotlib>=3.7"]
vit = ["timm>=0.9"]
pe = ["lief", "pefile"]           # EMBER v2 extraction also needs the `ember` package (github.com/elastic/ember)
dex = ["androguard"]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/mani-arora/TrustFusion"

[tool.setuptools.packages.find]
include = ["trustfusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
